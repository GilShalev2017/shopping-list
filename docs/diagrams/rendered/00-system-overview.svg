thAdjust="spacing" textLength="56.6719" x="942.8682" y="617.3638">nothing</text><text fill="#000000" font-family="Sans" font-size="13" lengthAdjust="spacing" textLength="13" x="1003.6724" y="617.3638">&#8212;</text><text fill="#000000" font-family="Sans" font-size="13" lengthAdjust="spacing" textLength="257.3594" x="780" y="632.4966">no database, no library, no deployment</text><text fill="#000000" font-family="Sans" font-size="13" lengthAdjust="spacing" textLength="236.8564" x="780" y="647.6294">unit. They meet only in the browser.</text></g><!--link user to client--><g id="link_user_client"><path d="M487,118.8969 C487,150.3669 487,188.5669 487,215.4969 " fill="none" id="user-to-client" style="stroke:#2F5FD8;stroke-width:1.0;"/><polygon fill="#2F5FD8" points="487,221.4969,491,212.4969,487,216.4969,483,212.4969,487,221.4969" style="stroke:#2F5FD8;stroke-width:1.0;"/><text fill="#000000" font-family="Sans" font-size="13" lengthAdjust="spacing" textLength="29.7832" x="488" y="161.8638">uses</text></g><!--link client to catalog--><g id="link_client_catalog"><path d="M514.73,270.9669 C524.48,280.2169 535,291.3569 543,302.7969 C572.27,344.6469 592.653,394.2732 604.813,427.9632 " fill="none" id="client-to-catalog" style="stroke:#2F5FD8;stroke-width:1.0;"/><polygon fill="#2F5FD8" points="606.85,433.6069,607.5569,423.7834,605.1525,428.9038,600.0321,426.4994,606.85,433.6069" style="stroke:#2F5FD8;stroke-width:1.0;"/><text fill="#000000" font-family="Sans" font-size="13" lengthAdjust="spacing" textLength="127.0928" x="562" y="315.8638">GET /api/categories</text><text fill="#000000" font-family="Sans" font-size="13" lengthAdjust="spacing" textLength="116.0098" x="567.5415" y="330.9966">GET /api/products</text></g><!--link client to orders--><g id="link_client_orders"><path d="M437.76,270.8069 C424.02,279.2969 410.11,290.0069 400,302.7969 C369.17,341.8069 355.7657,393.0441 349.4457,427.7241 " fill="none" id="client-to-orders" style="stroke:#2F5FD8;stroke-width:1.0;"/><polygon f